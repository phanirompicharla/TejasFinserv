<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" role="img" aria-label="Royal Sundaram General Insurance">
  <!-- Background -->
  <rect width="280" height="90" fill="#ffffff" rx="3"/>

  <!-- Sun symbol -->
  <circle cx="45" cy="45" r="20" fill="#C8102E"/>
  <!-- Sun rays -->
  <line x1="45" y1="18" x2="45" y2="10" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="45" y1="72" x2="45" y2="80" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="18" y1="45" x2="10" y2="45" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="72" y1="45" x2="80" y2="45" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="25.5" y1="25.5" x2="20" y2="20" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="64.5" y1="64.5" x2="70" y2="70" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="64.5" y1="25.5" x2="70" y2="20" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="25.5" y1="64.5" x2="20" y2="70" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner white circle -->
  <circle cx="45" cy="45" r="11" fill="#ffffff"/>

  <!-- Company name text -->
  <text x="78" y="35" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#1a1a2e" letter-spacing="0.2">Royal Sundaram</text>
  <text x="78" y="55" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#C8102E" letter-spacing="0.8">GENERAL INSURANCE</text>
  <text x="78" y="71" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#888888" letter-spacing="0.3">A Fairfax Group Company</text>
</svg>
