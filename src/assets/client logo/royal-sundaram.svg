<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" role="img" aria-label="Royal Sundaram General Insurance">
  <!-- Royal Sundaram General Insurance – clean brand placeholder SVG -->
  <!-- Background -->
  <rect width="300" height="100" fill="#ffffff" rx="4"/>

  <!-- Red accent bar (brand color) -->
  <rect x="0" y="0" width="8" height="100" fill="#C8102E" rx="2"/>

  <!-- Sun symbol (stylised) -->
  <circle cx="38" cy="50" r="16" fill="#C8102E"/>
  <!-- Sun rays -->
  <line x1="38" y1="28" x2="38" y2="22" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="72" x2="38" y2="78" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="50" x2="10" y2="50" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="66" y2="50" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="22.8" y1="34.8" x2="18.8" y2="30.8" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="53.2" y1="65.2" x2="57.2" y2="69.2" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="53.2" y1="34.8" x2="57.2" y2="30.8" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <line x1="22.8" y1="65.2" x2="18.8" y2="69.2" stroke="#C8102E" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner white circle -->
  <circle cx="38" cy="50" r="9" fill="#ffffff"/>

  <!-- Company name text -->
  <text x="78" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1a1a2e" letter-spacing="0.3">Royal Sundaram</text>
  <text x="78" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#C8102E" letter-spacing="0.5">GENERAL INSURANCE</text>
  <text x="78" y="75" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#666666" letter-spacing="0.2">A Fairfax Group Company</text>
</svg>
