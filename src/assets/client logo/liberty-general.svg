<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" role="img" aria-label="Liberty General Insurance">
  <!-- Background -->
  <rect width="260" height="80" fill="#ffffff" rx="3"/>

  <!-- Liberty Statue silhouette (stylised torch-holder figure) -->
  <!-- Base pedestal -->
  <rect x="12" y="62" width="28" height="10" fill="#1c2951" rx="1"/>
  <!-- Body/robe -->
  <rect x="18" y="30" width="16" height="34" fill="#1c2951" rx="2"/>
  <!-- Arm raised holding torch -->
  <line x1="26" y1="36" x2="36" y2="20" stroke="#1c2951" stroke-width="3" stroke-linecap="round"/>
  <!-- Torch flame -->
  <ellipse cx="36" cy="17" rx="4" ry="6" fill="#e8a020"/>
  <ellipse cx="36" cy="20" rx="2.5" ry="3" fill="#f0c040"/>
  <!-- Head with crown spikes -->
  <circle cx="26" cy="26" r="7" fill="#1c2951"/>
  <!-- Crown spikes -->
  <polygon points="22,20 23.5,14 25,20" fill="#1c2951"/>
  <polygon points="25,19 26.5,13 28,19" fill="#1c2951"/>
  <polygon points="28,20 29.5,14 31,20" fill="#1c2951"/>

  <!-- Company name text block -->
  <text x="52" y="30" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#1c2951" letter-spacing="0.3">Liberty</text>
  <text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1c2951" letter-spacing="0.2">General Insurance</text>
  <!-- Tagline underline bar -->
  <rect x="52" y="53" width="120" height="1.5" fill="#e8a020" rx="1"/>
  <text x="52" y="67" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="400" fill="#888888" letter-spacing="0.3">Part of Liberty Mutual Group</text>
</svg>
