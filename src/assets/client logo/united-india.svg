<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 85" role="img" aria-label="United India Insurance">
  <!-- Background -->
  <rect width="260" height="85" fill="#ffffff" rx="3"/>

  <!-- Circular emblem (United India brand mark) -->
  <!-- Outer ring -->
  <circle cx="42" cy="42" r="36" fill="#034ea2"/>
  <!-- Middle white ring -->
  <circle cx="42" cy="42" r="29" fill="#ffffff"/>
  <!-- Inner blue filled circle -->
  <circle cx="42" cy="42" r="22" fill="#034ea2"/>

  <!-- "UI" monogram inside -->
  <text x="42" y="50" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">UI</text>

  <!-- Company name -->
  <text x="90" y="31" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#034ea2" letter-spacing="0.2">United India</text>
  <text x="90" y="50" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#034ea2" letter-spacing="0.2">Insurance</text>
  <text x="90" y="67" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#888888" letter-spacing="0.4">A Government of India Enterprise</text>
</svg>